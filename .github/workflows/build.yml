name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Tao project
        run: |
          flutter create --platforms android --org vn.docpdf --project-name doc_pdf_net app
          rm -rf app/test
          ASSETS=app/android/app/src/main/assets
          mkdir -p "$ASSETS"
          cp index.html "$ASSETS/index.html"
          curl -fL -o "$ASSETS/pdf.min.js" https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js
          curl -fL -o "$ASSETS/pdf.worker.min.js" https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js
          MF=app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Đọc PDF nét"/' "$MF"
          sed -i 's/ android:enableOnBackInvokedCallback="[^"]*"//' "$MF"
          sed -i 's/ android:requestLegacyExternalStorage="[^"]*"//' "$MF"
          sed -i '0,/<application/s#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <application android:requestLegacyExternalStorage="true" android:enableOnBackInvokedCallback="false"#' "$MF"
          cat "$MF"
          MA=$(find app/android/app/src/main -name MainActivity.kt | head -n 1)
          PKG=$(grep -m1 '^package' "$MA")
          { echo "$PKG"; cat MainActivity.kt; } > "$MA"

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: doc-pdf-net-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
