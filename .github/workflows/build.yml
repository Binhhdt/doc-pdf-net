name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Tao project
        run: |
          flutter create --platforms android --org vn.docpdf --project-name doc_pdf_net app
          rm -rf app/test
          ASSETS=app/android/app/src/main/assets
          mkdir -p "$ASSETS"
          cp index.html "$ASSETS/index.html"
          curl -fL -o "$ASSETS/pdf.min.js" https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js
          curl -fL -o "$ASSETS/pdf.worker.min.js" https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js
          sed -i 's/android:label="[^"]*"/android:label="Đọc PDF nét"/' app/android/app/src/main/AndroidManifest.xml
          MA=$(find app/android/app/src/main -name MainActivity.kt | head -n 1)
          PKG=$(grep -m1 '^package' "$MA")
          echo "$PKG" > "$MA"
          cat >> "$MA" <<'EOF'

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.widget.FrameLayout

          class MainActivity : Activity() {
              private var fileCb: ValueCallback<Array<Uri>>? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val w = WebView(this)
                  w.settings.javaScriptEnabled = true
                  w.settings.domStorageEnabled = true
                  w.settings.allowFileAccess = true
                  w.settings.builtInZoomControls = true
                  w.settings.displayZoomControls = false
                  w.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          view: WebView?,
                          cb: ValueCallback<Array<Uri>>?,
                          params: WebChromeClient.FileChooserParams?
                      ): Boolean {
                          fileCb?.onReceiveValue(null)
                          fileCb = cb
                          val i = Intent(Intent.ACTION_GET_CONTENT)
                          i.addCategory(Intent.CATEGORY_OPENABLE)
                          i.type = "application/pdf"
                          return try {
                              startActivityForResult(i, 1)
                              true
                          } catch (e: Exception) {
                              fileCb = null
                              false
                          }
                      }
                  }
                  val root = FrameLayout(this)
                  root.fitsSystemWindows = true
                  root.addView(w)
                  setContentView(root)
                  w.loadUrl("file:///android_asset/index.html")
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 1) {
                      val uri = if (resultCode == RESULT_OK) data?.data else null
                      fileCb?.onReceiveValue(if (uri != null) arrayOf(uri) else null)
                      fileCb = null
                  }
              }
          }
          EOF
          cat "$MA"

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: doc-pdf-net-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
